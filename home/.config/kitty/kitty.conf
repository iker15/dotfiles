# Efecto glass: fondo transparente (Hyprland pone el desenfoque), texto nítido.
# Los colores los pone Caelestia según el fondo de pantalla.
background_opacity 0.75
dynamic_background_opacity yes

# Usar siempre fish (tiene el saludo con el ojo)
shell /bin/fish

# Abrir siempre normal (si no, kitty recuerda que la última estaba maximizada y abre todas así)
remember_window_size no
